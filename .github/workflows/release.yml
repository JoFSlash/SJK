name: SJK release

# SJK only. Pushing a tag named sjk-v<version> (for example sjk-v2026.1005.1, a
# date version, docs/sjk.md "Version") builds the
# Windows x64, Linux x64 and macOS Apple Silicon drop-in ZIPs exactly as the GameData packages workflow
# does (scripts/package_client.py, with its smoke check), names them
# SJK-<version>-<platform>.zip and publishes them as a GitHub Release with the
# checksums and the matching source snapshot. Rerun on an existing tag with
# "Run workflow".
on:
  push:
    tags: ['sjk-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing sjk-v* tag to (re)build and publish
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # SJK's development stage, shown in the release title ("Sol JK <version> (Alpha)").
  STAGE: Alpha

jobs:
  draft:
    name: Draft the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Read the version from the tag
        run: |
          case "$TAG" in
            sjk-v?*) echo "version=${TAG#sjk-v}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Release tags look like sjk-v0.2.0, got $TAG"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Create the draft release (kept if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; its assets will be replaced."
            exit 0
          fi
          cat > notes.md <<EOF
          <p align="center"><img src="https://raw.githubusercontent.com/${{ github.repository }}/refs/tags/$TAG/assets/branding/sjk-logo-512.png" alt="Sol JK emblem" width="200"></p>

          Sol JK $VERSION for Windows 10/11 x64 and Linux x64, plus an experimental,
          unsigned build for Macs with Apple Silicon (its README says how to allow it).

          **Install:** extract the whole ZIP for your platform into Jedi Academy's
          \`GameData\` folder, beside \`base\`, then launch \`sjk\` (\`sjk-client\` on a Mac). Your settings
          live in \`GameData/SJK/\` and are kept when you update. A legally owned copy
          of Jedi Academy is required; no game assets are included.

          The \`source\` ZIP is the matching source snapshot (GPL-2.0-only); the
          \`SHA256SUMS\` files list the checksums.
          EOF
          gh release create "$TAG" --verify-tag --draft \
            --title "Sol JK $VERSION${STAGE:+ ($STAGE)}" --notes-file notes.md --generate-notes

  package:
    name: Package (${{ matrix.platform }})
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            rustflags: ''
          - os: windows-latest
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          # Apple Silicon only; unsigned (docs/packages.md#macos).
          - os: macos-latest
            platform: macos-arm64
            target: aarch64-apple-darwin
            rustflags: ''
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: ${{ matrix.rustflags }}
      # The oldest macOS the Mac build starts on; ignored by the other targets.
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      VERSION: ${{ needs.draft.outputs.version }}
      # The programs' build scripts name the build after the tag's version
      # (scripts/build_version.rs); a build without it says <version>-dev.
      SJK_VERSION: ${{ needs.draft.outputs.version }}
    steps:
      - name: Preserve source and embedded shader line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: source
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config libasound2-dev libwayland-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
          key: release-${{ matrix.target }}
      - name: Build optimized client and dedicated server
        working-directory: source
        run: cargo build --locked --release --target ${{ matrix.target }} -p sjk-viewer -p sjk-dedicated
      - name: Package and smoke-check extracted executables
        run: >-
          python source/scripts/package_client.py
          --source source --target ${{ matrix.target }}
          --platform ${{ matrix.platform }} --output dist --smoke-check
          --name SJK --version ${{ env.VERSION }} --profile-dir SJK
          --repository ${{ github.server_url }}/${{ github.repository }}
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every platform produces the same source snapshot; Linux uploads it.
          if [ "${{ matrix.platform }}" != linux-x64 ]; then
            rm -f dist/*-source.zip
          fi
          gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"

  publish:
    name: Publish the release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Publish and mark as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
